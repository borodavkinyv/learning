<html>

<head>
    <title>My Select</title>
</head>

<body>
    <script>
        const components = ['my-select', 'my-panel'];

        const onLoad = (evt) => {
            console.log(`компонент загружен`);
        };

        const onError = (err) => {
            const script = err.target;
        };

        components.forEach(component => {
            const script = document.createElement('script');
            script.src = `./${component}.js`;
            script.dataset.name = component;
            script.addEventListener('load', onLoad);
            script.addEventListener('error', onError);
            document.body.append(script);
        });
    </script>


    <my-panel>
        <span slot="header">Сворачиваемая панель</span>

        <my-select>
            <div slot="search">
                <input class="light-find-box" placeholder="Поиск...">
            </div>

            <option value="opt1">Option 1</option>
            <option value="opt2">Option 2</option>
            <option value="opt3">Option 3</option>
        </my-select>
    </my-panel>
</body>

</html>
